<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <title>Нет подключения — Demo CRM</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
        background: #0b0b0d;
        color: #f4f4f5;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 24rem);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .dot {
        width: 0.55rem;
        height: 0.55rem;
        margin-bottom: 0.7rem;
        border-radius: 2px;
        background: #ff5a1f;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #8b8b93;
        line-height: 1.5;
      }
      button {
        margin-top: 1.25rem;
        min-height: 44px;
        padding: 0 1rem;
        border: 0;
        border-radius: 9px;
        background: #ff5a1f;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ff5a1f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">DEMO <span class="dot" aria-hidden="true"></span></div>
      <h1>Нет подключения</h1>
      <p>Проверьте сеть и откройте Demo CRM снова. Задачи и продажи подтянутся, когда связь появится.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
